<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schackreview">
<meta name="theme-color" content="#262522">
<meta name="robots" content="noindex, nofollow">
<title>Schackreview</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <button class="hbtn" id="h-back" aria-label="Tillbaka"></button>
    <h1 id="h-title">Schackreview</h1>
    <div class="hright" id="h-right"></div>
  </header>

  <div class="scroll" id="scroll">
    <section class="home" id="home"></section>
    <div class="stage" id="stage">
      <div class="evalh" id="evalh"><div class="fill" id="evalfill"></div><span class="etxt" id="evaltxt"></span></div>
      <div class="coachbox" id="coachbox"></div>
      <div class="board" id="board"></div>
      <div class="captured" id="captured"></div>
      <div class="stripwrap" id="stripwrap">
        <button class="sarrow" data-nav="prev" aria-label="Förra draget"></button>
        <div class="strip" id="strip"></div>
        <button class="sarrow" data-nav="next" aria-label="Nästa drag"></button>
      </div>
    </div>
    <main id="panel"></main>
  </div>

  <nav class="actionbar" id="bar"></nav>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-card">
    <div class="sheet-head"><b id="sheet-title"></b><button class="x" id="sheet-close" aria-label="Stäng">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="overlay" id="busy" hidden>
  <div class="busy-card">
    <div class="busy-pct" id="busy-pct">0 %</div>
    <div class="progress"><div id="busy-bar"></div></div>
    <div class="busy-text" id="busy-text">Stockfish analyserar…</div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
